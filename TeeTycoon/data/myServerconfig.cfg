# TeeTycoon server overrides.
# Loaded by autoexec_server.cfg; keep local secrets out of this tracked file.

sv_port 8303
sv_name "TeeTycoon Official server"
password ""
sv_map "TeeTycoon"
# Enable DDNet server-side test/RCON commands (super, weapons, freeze, etc.).
# This must be set in the startup config because sv_test_cmds is read-only at runtime.
sv_test_cmds 1
sv_register ipv4
sv_ipv4only 1
sv_eye_emote_change_delay 0
sv_emoticon_ms_delay 0
sv_global_emoticon_ms_delay 0
sv_max_clients 64
sv_max_clients_per_ip 4
sv_tournament_mode 0
sv_pauseable 0
sv_rescue 1
sv_rescue_delay 5
sv_welcome "Welcome to TeeTycoon!"
sv_announcement_filename "announcement.txt"
sv_announcement_interval 120
sv_announcement_random 1
sv_motd "Testserver with DDraceNetwork Features!\nDon't forget to check server rules by using /rules"
sv_ddrace_rules 1
sv_rules_line1 "be nice to each other"
sv_rules_line2 "Dont use any cheats/program"
sv_rules_line3 "Dont share your account with other players"
sv_tune_reset 1
sv_ddrace_tune_reset 1

